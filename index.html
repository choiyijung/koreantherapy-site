  <style>
    :root{
      --paper:#fbf7ef;
      --paper2:#f5ede1;
      --ink:#2c2926;
      --wine:#7d1830;
      --wine2:#991f3d;
      --gold:#c9a05d;
      --line:#dfc99f;
      --muted:#746b62;
      --white:#fffdf8;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      background:
        radial-gradient(circle at 20% 15%,rgba(201,160,93,.07),transparent 28%),
        linear-gradient(180deg,var(--paper),#fffaf2 48%,var(--paper2));
      font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    }
    a{text-decoration:none;color:inherit}
    .wrap{width:min(1180px,calc(100% - 40px));margin:auto}
    .topbar{border-bottom:1px solid rgba(201,160,93,.35);background:rgba(255,253,248,.94);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
    .nav{height:82px;display:flex;align-items:center;gap:34px}
    .brand{display:flex;align-items:center;gap:13px;margin-right:auto}
    .seal{width:45px;height:45px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--wine);font-weight:900;font-family:serif}
    .brand strong{font-family:Georgia,"Times New Roman","Batang",serif;font-size:25px;font-weight:700;letter-spacing:-1px}
    .navlinks{display:flex;gap:28px;font-size:14px;font-weight:700}
    .navlinks a{position:relative;padding:31px 0 25px}
    .navlinks a:first-child{color:var(--wine)}
    .navlinks a:first-child:after{content:"";position:absolute;left:0;right:0;bottom:17px;height:2px;background:var(--wine)}
    .topcall{background:var(--wine);color:#fff;padding:12px 19px;border-radius:999px;font-weight:800;font-size:14px}
    .hero{overflow:hidden;border-bottom:1px solid var(--line)}
    .hero-grid{display:grid;grid-template-columns:1.02fr .98fr;min-height:560px}
    .hero-copy{position:relative;padding:82px 70px 70px 24px;display:flex;flex-direction:column;justify-content:center}
    .hero-copy:before{content:"";position:absolute;left:-70px;top:28px;width:250px;height:190px;background:
      radial-gradient(circle at 25% 30%,rgba(153,31,61,.16) 0 6px,transparent 7px),
      radial-gradient(circle at 48% 42%,rgba(153,31,61,.12) 0 5px,transparent 6px);
      opacity:.7}
    .eyebrow{color:var(--wine);font-family:Georgia,"Batang",serif;font-weight:700;letter-spacing:.12em;margin-bottom:17px}
    .eyebrow:after{content:"";display:inline-block;width:80px;height:1px;background:var(--gold);margin:0 0 4px 15px}
    h1{font-family:Georgia,"Times New Roman","Batang",serif;font-size:58px;line-height:1.22;margin:0 0 24px;letter-spacing:-2px;font-weight:600}
    h1 .wine{color:var(--wine)}
    .hero-copy p{max-width:560px;line-height:1.9;color:var(--muted);font-size:16px;margin:0 0 32px}
    .actions{display:flex;gap:13px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:7px;font-weight:800;border:1px solid var(--gold)}
    .btn.primary{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border-color:var(--wine)}
    .btn.secondary{background:rgba(255,255,255,.55);color:var(--wine)}
    .hero-photo{position:relative;min-height:560px;overflow:hidden;border-left:1px solid rgba(201,160,93,.35)}
    .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) contrast(.98) sepia(.08)}
    .hero-photo:before{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,rgba(251,247,239,.28),transparent 25%)}
    section.block{padding:70px 0}
    .section-head{text-align:center;margin-bottom:34px}
    .section-head .mini{color:var(--gold);letter-spacing:.25em;font-size:12px;font-weight:800}
    .section-head h2{font-family:Georgia,"Batang",serif;font-size:36px;margin:10px 0 0;font-weight:600}
    .course-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .course{background:rgba(255,253,248,.8);border:1px solid var(--line);padding:26px 24px 22px;border-radius:6px;position:relative;box-shadow:0 10px 30px rgba(92,57,27,.045)}
    .course:before,.course:after{content:"";position:absolute;width:26px;height:26px;border-color:var(--gold)}
    .course:before{left:7px;top:7px;border-left:1px solid;border-top:1px solid}
    .course:after{right:7px;bottom:7px;border-right:1px solid;border-bottom:1px solid}
    .course .icon{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;background:var(--wine);color:#f7dcab;display:grid;place-items:center;font-size:21px}
    .course h3{text-align:center;color:var(--wine);font-family:Georgia,"Batang",serif;font-size:21px;margin:0 0 17px}
    .price{display:flex;justify-content:space-between;border-top:1px solid rgba(201,160,93,.24);padding:11px 3px 0;margin-top:10px;font-size:14px}
    .price strong{font-size:16px}
    .regions{background:rgba(255,255,255,.38);border-top:1px solid rgba(201,160,93,.28);border-bottom:1px solid rgba(201,160,93,.28)}
    .region-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .region{background:var(--white);border:1px solid var(--line);padding:22px 12px;text-align:center;font-family:Georgia,"Batang",serif;font-size:20px;position:relative}
    .region span{display:block;color:var(--gold);font-family:Arial,sans-serif;font-size:11px;letter-spacing:.12em;margin-top:7px}
    .guide{padding:68px 0 82px}
    .guide-box{background:linear-gradient(135deg,#f5ead7,#fffaf0);border:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;gap:30px;padding:38px 46px;position:relative;overflow:hidden}
    .guide-box:after{content:"";position:absolute;right:-80px;bottom:-100px;width:300px;height:220px;border-radius:50%;background:rgba(201,160,93,.10)}
    .guide h2{font-family:Georgia,"Batang",serif;margin:0 0 10px;font-size:31px}
    .guide p{margin:0;color:var(--muted)}
    .bigcall{font-family:Georgia,serif;font-size:36px;color:var(--wine);font-weight:700;white-space:nowrap;position:relative;z-index:2}
    footer{background:var(--wine);color:#f3dfc1;padding:25px 0;text-align:center;font-size:13px;letter-spacing:.08em}
    .mobile{display:none}
    @media(max-width:900px){
      .navlinks{display:none}.topcall{display:none}.nav{height:68px}
      .brand strong{font-size:21px}
      .hero-grid{grid-template-columns:1fr}.hero-copy{padding:58px 10px 42px}.hero-photo{min-height:390px;border-left:0;border-top:1px solid var(--line)}
      h1{font-size:43px}.course-grid{grid-template-columns:repeat(2,1fr)}.region-grid{grid-template-columns:repeat(2,1fr)}
      .guide-box{grid-template-columns:1fr;padding:30px}.bigcall{font-size:28px}
      .mobile{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:1fr 1fr}
      .mobile a{padding:15px;text-align:center;font-weight:800;background:var(--wine);color:#fff}
      .mobile a+ a{background:#b58a4f}
      body{padding-bottom:50px}
    }
    @media(max-width:560px){
      .wrap{width:min(100% - 24px,1180px)}
      .hero-copy{padding-top:44px}
      h1{font-size:37px}
      .course-grid{grid-template-columns:1fr}
      .region-grid{grid-template-columns:1fr 1fr}
    }
  </style>
